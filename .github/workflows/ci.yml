name: CI

on:
  push:
    branches: [master, 'v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: vendor/bin/phpunit

  without-json-api:
    name: Tests without ark4ne/laravel-json-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Remove the JSON:API package
        run: composer remove --dev ark4ne/laravel-json-api --no-interaction

      - name: PHPUnit without the JSON:API tests
        # The integration loads none of the classes of the package: everything else works without it.
        run: vendor/bin/phpunit --exclude-group json-api

  static:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  coverage:
    name: Coverage (minimum 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=build/coverage/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Minimum coverage
        run: php bin/coverage-check.php build/coverage/clover.xml 90

  mutation:
    name: Mutation testing (minimum 80% MSI)
    runs-on: ubuntu-latest
    # Blocking on master, informative on other branches.
    continue-on-error: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: pcov
          tools: infection

      - uses: ramsey/composer-install@v3

      - name: Infection
        run: infection --threads=max --no-progress --show-mutations

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Composer audit
        run: composer audit
